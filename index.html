<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is the Mizuki Stores return and replacement policy?", "acceptedAnswer": {"@type": "Answer", "text": "Orders are prepaid. Items that arrive damaged in transit, defective or wrong are covered by a free 7-day replacement when reported within 48 hours of delivery with an uncut 360-degree unboxing video. Used, worn or unsealed items cannot be returned."}}, {"@type": "Question", "name": "What if my item arrives damaged or defective?", "acceptedAnswer": {"@type": "Answer", "text": "Report it within 48 hours of delivery with one uncut video of you opening the parcel, from the sealed label to the defect. We send a free replacement within the 7-day window."}}, {"@type": "Question", "name": "Can I return a used or opened item?", "acceptedAnswer": {"@type": "Answer", "text": "No. Used, worn, unsealed and personal-use items are not returnable or refundable for a change of mind, so every customer receives a brand-new, untouched product."}}, {"@type": "Question", "name": "What happens if the courier loses my parcel?", "acceptedAnswer": {"@type": "Answer", "text": "You receive a full refund or a replacement."}}, {"@type": "Question", "name": "How long does shipping take and how can I pay?", "acceptedAnswer": {"@type": "Answer", "text": "Orders are dispatched within 24 to 48 hours with an AWB tracking number. Payment is prepaid by UPI, cards or netbanking through Razorpay. Cash on delivery is not offered."}}]}</script>
<style>

  Auth.signup = async ({ name, email, password, prefs }) => {

  };
  Auth.changePassword = async (uid, oldPw, newPw) => {

  Shop.products = () => Cloud.products;

  };
  Admin.users = () => { Admin.guard(); const o = Cloud.orders; return Cloud.users.map(({ pw, wish, ...u }) => ({ ...u, wishCount: wish.length, orders: o.filter(x => x.uid === u.uid).length })); };

}

<script id="home">
/* =====================================================================

const Face = (() => {

/* ---------- Google and Apple (light up when the keys are in CONFIG) ---------- */
const jwt = t => JSON.parse(decodeURIComponent(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")).split("").map(c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join("")));
const loadScript = src => new Promise((ok, no) => { if ($(`script[src="${src}"]`)) return ok(); const s = document.createElement("script"); s.src = src; s.async = true; s.onload = ok; s.onerror = () => no(new Error("Could not load the sign-in script.")); document.head.appendChild(s); });
async function viaToken(provider, token, aud, issuers) {
  const c = jwt(token);
  if (c.aud !== aud || !issuers.includes(c.iss) || c.exp * 1000 < now() || String(c.email_verified) === "false") throw new AppError("token", "Sign-in could not be verified.");
  closeModal(); await enter(Auth.social({ provider, email: c.email, name: c.name }).session, true);
}
async function googleLogin() {
  if (CLOUD) return Cloud.oauth("google").catch(e => formError(e.message));
  if (!CONFIG.GOOGLE_CLIENT_ID) return formError("Google sign-in will be available soon.");
  try { await loadScript("https://accounts.google.com/gsi/client");
    google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: r => viaToken("google", r.credential, CONFIG.GOOGLE_CLIENT_ID, ["accounts.google.com", "https://accounts.google.com"]).catch(e => formError(e.message)) });
    google.accounts.id.prompt(); } catch (e) { formError(e.message); }
}
async function appleLogin() {
  if (CLOUD) return Cloud.oauth("apple").catch(e => formError(e.message));
  if (!CONFIG.APPLE_CLIENT_ID || !CONFIG.APPLE_REDIRECT_URI) return formError("Apple sign-in will be available soon.");
  try { await loadScript("https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js");
    AppleID.auth.init({ clientId: CONFIG.APPLE_CLIENT_ID, scope: "name email", redirectURI: CONFIG.APPLE_REDIRECT_URI, usePopup: true });
    const r = await AppleID.auth.signIn(); const n = r.user && r.user.name ? r.user.name.firstName : "";
    const c = jwt(r.authorization.id_token); if (n) c.name = n;
    if (c.aud !== CONFIG.APPLE_CLIENT_ID || c.iss !== "https://appleid.apple.com" || c.exp * 1000 < now()) throw new AppError("token", "Sign-in could not be verified.");
    closeModal(); await enter(Auth.social({ provider: "apple", email: c.email, name: c.name }).session, true);
  } catch (e) { if (e && e.error !== "popup_closed_by_user") formError(e.message || "Apple sign-in was cancelled."); }
}

/* ---------- the "preparing your ID" moment ---------- */
async function ceremony(kind, user) {
  const el = $("#ceremony"), owner = kind === "owner", first = !owner && user && !user.idShown, ms = first ? 1100 : 700;
  const steps = owner ? ["Checking your owner key", "Unlocking the console", "Loading your store"] : ["Checking your details", first ? "Creating your Mizuki ID" : "Finding your Mizuki ID", "Securing your vault"];
  const since = user ? new Date(user.created).toLocaleDateString("en", { month: "short", year: "numeric" }) : "";
  mount(el, T`<div class="cer"><div class="rings"><i></i><i></i><i></i></div><h2>${owner ? "Opening your console" : first ? "We’re preparing your ID" : "Welcome back, " + (user.name.split(" ")[0])}</h2><p class="muted">Just a few seconds.</p>
    <ul class="steps">${steps.map((s, i) => T`<li style="--i:${i}"><span class="tick"></span>${s}</li>`)}</ul><div class="prog"><b></b></div>
    <div class="idcard"><div><small>${storeName()}</small></div><div><small>${owner ? "Owner" : "Member ID"}</small><br><b>${owner ? "FULL ACCESS" : user.id}</b></div><div style="display:flex;justify-content:space-between"><span>${owner ? "Owner" : user.name}</span><small>${owner ? "" : "Since " + since}</small></div></div></div>`);
  el.className = "on"; document.body.classList.add("lock");
  const li = $$("li", el), bar = $(".prog b", el);
  for (let i = 0; i < li.length; i++) { await wait(ms); li[i].classList.add("done"); bar.style.width = Math.round((i + 1) / (li.length + 1) * 100) + "%"; }
  await wait(450); bar.style.width = "100%"; $(".idcard", el).classList.add("show"); await wait(first || owner ? 2300 : 1500);
  el.classList.add("out"); await wait(600); el.className = ""; el.innerHTML = ""; document.body.classList.remove("lock");
}

/* ---------- entering the app ---------- */

      <div class="tbl glass rv"><table><thead><tr><th>Invoice</th><th>Date</th><th>Items</th><th>Amount</th><th>Status</th></tr></thead><tbody>${o.length ? o.map(x => T`<tr><td>${x.id}</td><td>${new Date(x.t).toLocaleDateString("en")}</td><td>${x.items.length}</td><td>${money(x.total)}</td><td><span class="tag">${x.status}</span></td></tr>`) : T`<tr><td colspan="5" class="muted">No invoices yet.</td></tr>`}</tbody></table></div>`;
  },
  security(u) {
    const a = Audit.list().filter(x => x.uid === u.uid).slice(0, 8);
    return T`<div class="ph"><div><h1>Security</h1><p>Keep your account safe.</p></div></div><div class="two"><div class="card glass pad rv"><h3>Change password</h3>${u.pw ? T`<label for="op">Current password</label><input id="op" type="password" autocomplete="current-password"><label for="np">New password</label><input id="np" type="password" autocomplete="new-password"><div class="err" id="perr"></div><button class="btn" data-act="changePw">Update password</button>` : T`<p class="muted" style="margin-top:.6rem">You sign in with ${u.provider}, so there is no password to change.</p>`}</div>
      <div class="card glass pad rv"><h3>Devices</h3><p class="muted" style="margin:.6rem 0 1rem">Signed in somewhere you do not recognise? Sign out everywhere, this device stays signed in.</p><button class="btn ghost" data-act="outAll">Sign out of all devices</button></div></div>
      <div class="card glass pad rv" style="margin-top:1rem"><h3>Recent activity</h3>${a.map(x => T`<div class="line"><span>${x.msg}</span><span class="muted">${new Date(x.t).toLocaleString("en", { dateStyle: "medium", timeStyle: "short" })}</span></div>`)}</div>`;
  },
  help() {
    const q = [["How do I track my order?", "Open Orders from the menu. The line under each order shows where it is."], ["Is my password safe?", "Your password is scrambled in your browser before it is saved. Nobody, including the store owner, can read it."], ["How do I stay signed in?", "You stay signed in on this device. Use Sign out in the menu when you are on a shared computer."], ["How do I delete my account?", "Contact the store and we will remove it."]];
    return T`<div class="ph"><div><h1>Help</h1></div></div><div class="card glass pad rv">${q.map(([a, b]) => T`<details><summary>${a}</summary><p>${b}</p></details>`)}</div>`;
  },

  /* ---------- owner console ---------- */
  "o-overview"() {
    const s = Admin.stats(), a = Audit.list().slice(0, 8);
    return T`<div class="ph"><div><h1 class="sheen">Owner console</h1><p>Everything about your store in one place.</p></div></div>
      ${CLOUD ? "" : T`<div class="note rv"><b>Local mode.</b> This console shows the accounts and orders saved in this browser. To see every customer from every device, connect an online database (see the guide).</div>`}
      <div class="stats">${stat("Accounts", s.accounts)}${stat("Online now", s.online)}${stat("Logins today", s.today)}${stat("New this week", s.week)}${stat("Orders", s.orders)}${stat("Revenue", s.revenue, "money")}${stat("Products", s.products)}${stat("Suspended", s.banned)}</div>
      <div class="card glass pad rv"><h3>Recent activity</h3>${a.length ? a.map(x => T`<div class="line"><span>${x.msg}</span><span class="muted">${new Date(x.t).toLocaleString("en", { dateStyle: "medium", timeStyle: "short" })}</span></div>`) : T`<p class="muted">Nothing yet.</p>`}</div>`;
  },
  "o-users"() {
    const l = Admin.users().sort((a, b) => b.created - a.created);
    return T`<div class="ph"><div><h1>People</h1><p>${l.length} accounts. Passwords are never shown, by design.</p></div></div>
      <div class="tools"><input id="uq" placeholder="Search name, email or ID" aria-label="Search people"></div>
      <div class="tbl glass rv"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Via</th><th>Joined</th><th>Last login</th><th>Logins</th><th>Orders</th><th>Status</th><th></th></tr></thead><tbody id="ut">${l.length ? l.map(u => T`<tr data-s="${(u.id + u.name + u.email).toLowerCase()}"><td><b>${u.id}</b></td><td>${u.name}</td><td>${u.email}</td><td>${u.provider}</td><td>${new Date(u.created).toLocaleDateString("en")}</td><td>${new Date(u.last).toLocaleDateString("en")}</td><td>${u.logins}</td><td>${u.orders}</td>
        <td><span class="tag ${u.banned ? "bad" : "ok"}">${u.banned ? "Suspended" : "Active"}</span></td><td style="white-space:nowrap"><button class="btn ${u.banned ? "ghost" : "danger"} sm" data-act="ban" data-id="${u.uid}" data-v="${u.banned ? 0 : 1}">${u.banned ? "Restore" : "Suspend"}</button> ${CLOUD ? "" : T`<button class="btn ghost sm" data-act="kick" data-id="${u.uid}">Sign out</button>`}</td></tr>`) : T`<tr><td colspan="10" class="muted">No accounts yet.</td></tr>`}</tbody></table></div>`;
  },
  "o-products"() {
    const l = Shop.products();
    return T`<div class="ph"><div><h1>Products</h1><p>${l.length} in the store</p></div><button class="btn mag" data-act="editProd" data-id="">Add product</button></div>
      <div class="tbl glass rv"><table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody>${l.map(p => T`<tr><td>${p.name}</td><td>${p.cat}</td><td>${money(p.price)}</td><td>${p.stock < 1 ? T`<span class="tag bad">Sold out</span>` : p.stock <= 5 ? T`<span class="tag gold">${p.stock} left</span>` : p.stock}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-act="editProd" data-id="${p.id}">Edit</button> <button class="btn danger sm" data-act="delProd" data-id="${p.id}">Delete</button></td></tr>`)}</tbody></table></div>`;
  },
  "o-orders"() {
    const l = Shop.orders(), users = Auth.users(), St = ["Placed", "Packed", "Shipped", "Delivered", "Cancelled"];
    return T`<div class="ph"><div><h1>Orders</h1><p>${l.length} in total</p></div></div><div class="tbl glass rv"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>${l.length ? l.map(o => { const c = users.find(u => u.uid === o.uid); return T`<tr><td>${o.id}<br><small class="muted">${new Date(o.t).toLocaleDateString("en")}</small></td><td>${c ? c.name + " (" + c.id + ")" : "Unknown"}</td><td>${o.items.map(i => i.name + " × " + i.q).join(", ")}</td><td>${money(o.total)}</td><td><select data-act="status" data-id="${o.id}" aria-label="Status">${St.map(s => T`<option ${s === o.status ? "selected" : ""}>${s}</option>`)}</select></td></tr>`; }) : T`<tr><td colspan="5" class="muted">No orders yet.</td></tr>`}</tbody></table></div>`;
  },
  "o-shipping"() {
    const s = Settings.get(), C = ["Shiprocket", "Delhivery", "Blue Dart", "DTDC", "India Post"];
    return T`<div class="ph"><div><h1>Shipping</h1><p>Delivery partners and delivery charges.</p></div></div><div class="note rv"><b>Live rates and labels</b> need your courier keys and a backend. Switch on the partners you use now, and they will be connected later.</div>
      <div class="two"><div class="card glass pad rv"><h3>Partners</h3>${C.map(c => T`<div class="line"><span>${c}</span><button class="sw ${s.carriers[c] ? "on" : ""}" data-act="carrier" data-c="${c}" role="switch" aria-checked="${!!s.carriers[c]}" aria-label="${c}"></button></div>`)}</div>
      <div class="card glass pad rv"><h3>Charges</h3><label for="fs">Free delivery above (₹)</label><input id="fs" type="number" min="0" value="${s.freeShip}"><label for="sf">Delivery fee (₹)</label><input id="sf" type="number" min="0" value="${s.shipFee}"><button class="btn" data-act="saveShip" style="margin-top:1rem">Save</button></div></div>`;
  },
  "o-api"() {
    const snip = "SEED_PRODUCTS: " + JSON.stringify(Shop.products());
    return T`<div class="ph"><div><h1>API and export</h1><p>Move your data in and out.</p></div></div>
      <div class="two">${CLOUD ? T`<div class="card glass pad rv"><h3>Your products</h3><p class="muted" style="margin:.6rem 0">Products are stored online. Changes made here show for every visitor straight away.</p></div>` : T`<div class="card glass pad rv"><h3>Publish your products</h3><p class="muted" style="margin:.6rem 0 1rem">Visitors see the products written in the file. After editing products here, copy this snippet, replace SEED_PRODUCTS in CONFIG, and redeploy.</p><button class="btn" data-act="copy" data-w="catalog">Copy catalog snippet</button></div>`}
      <div class="card glass pad rv"><h3>Download</h3><p class="muted" style="margin:.6rem 0 1rem">People are exported without passwords.</p><div class="cta-row" style="justify-content:flex-start"><button class="btn ghost sm" data-act="dl" data-w="products">Products</button><button class="btn ghost sm" data-act="dl" data-w="people">People</button><button class="btn ghost sm" data-act="dl" data-w="orders">Orders</button></div></div></div>
      <div class="card glass pad rv" style="margin-top:1rem"><h3>Online backend</h3><p class="muted" style="margin:.6rem 0">Status: <span class="tag ${CLOUD ? "ok" : ""}">${CLOUD ? "Connected to Supabase" : "Not connected"}</span> Connecting a database gives you every customer, shared wishlists and orders, and real security.</p><pre>${snip.slice(0, 300)}${snip.length > 300 ? "…" : ""}</pre></div>`;
  },
  "o-settings"() {
    const s = Settings.get();
    return T`<div class="ph"><div><h1>Settings</h1></div></div><div class="two"><div class="card glass pad rv"><h3>Store</h3><label for="sn">Store name</label><input id="sn" value="${s.name}" maxlength="40">${CLOUD ? "" : T`<label for="sd">Stay signed in for</label><select id="sd">${[7, 30, 90].map(d => T`<option value="${d}" ${d === s.days ? "selected" : ""}>${d} days</option>`)}</select>`}
      <div class="line" style="margin-top:.6rem"><span>Accept new sign-ups</span><button class="sw ${s.open ? "on" : ""}" id="so" data-act="toggleOpen" role="switch" aria-checked="${s.open}" aria-label="Accept new sign-ups"></button></div><button class="btn" data-act="saveSettings" style="margin-top:1rem">Save</button></div>
      ${CLOUD ? "" : T`<div class="card glass pad rv"><h3>Danger zone</h3><p class="muted" style="margin:.6rem 0 1rem">Removes every account, order and setting saved in this browser.</p><button class="btn danger" data-act="reset">Erase local data</button></div>`}</div>`;
  },
  "o-log"() {
    const a = Audit.list();
    return T`<div class="ph"><div><h1>Activity log</h1><p>Sign-ins, bans and orders.</p></div></div><div class="card glass pad rv">${a.length ? a.slice(0, 100).map(x => T`<div class="line"><span><span class="tag">${x.type}</span> ${x.msg}</span><span class="muted">${new Date(x.t).toLocaleString("en", { dateStyle: "medium", timeStyle: "short" })}</span></div>`) : T`<p class="muted">Nothing yet.</p>`}</div>`;
  }
};

/* ---------- actions (one place for every click) ---------- */
const need = fn => async (...a) => { try { return await fn(...a); } catch (e) { if (e instanceof AppError) toast(e.message, true); else { console.error(e); toast("Something went wrong.", true); } } };
const download = (name, data) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
function bump() { const u = Auth.user(); const b = $("#cartBadge"); if (!u || !b) return; b.textContent = Shop.cart(u.uid).reduce((a, l) => a + l.q, 0) || ""; b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
function prodForm(p) {
  const v = modal(T`<h2>${p ? "Edit product" : "Add product"}</h2><label for="fn">Name</label><input id="fn" value="${p ? p.name : ""}" maxlength="80"><div class="two"><div><label for="fp">Price (₹)</label><input id="fp" type="number" min="0" value="${p ? p.price : ""}"></div><div><label for="fk">Stock</label><input id="fk" type="number" min="0" value="${p ? p.stock : ""}"></div></div>
    <label for="fc">Category</label><input id="fc" value="${p ? p.cat : ""}" maxlength="40"><label for="fd">Description</label><textarea id="fd" rows="3" maxlength="300">${p ? p.desc : ""}</textarea><label for="fo">Country of origin</label><input id="fo" value="${p ? p.origin || "India" : "India"}" maxlength="40"><label for="fh">Showcase headline (optional)</label><input id="fh" value="${p ? p.headline || "" : ""}" maxlength="40"><label for="ft">Showcase tagline (optional)</label><input id="ft" value="${p ? p.tagline || "" : ""}" maxlength="90"><label for="fi">Image link (https only, optional)</label><input id="fi" value="${p ? p.img : ""}" maxlength="500">
    <div class="err" id="ferr"></div><button class="btn block" data-act="saveProd" data-id="${p ? p.id : ""}">Save product</button>`);
}
const ACT = {
  close: () => closeModal(), drawer: () => openDrawer(!$("#drawer").classList.contains("on")), logout: () => logout("Signed out."),
  go: a => { closeDrawer(); const p = a.dataset.p; if (p === "cart") return Bag.open(); if (location.hash === "#/" + p) render(); else location.hash = "#/" + p; },
  auth: a => { window.__authMode = a.dataset.m; if (location.hash === "#/signin") authPage(a.dataset.m); else location.hash = "#/signin"; }, amode: a => setMode(a.dataset.m), google: googleLogin, apple: appleLogin,
  forgot: need(async () => { const e = $("#ae").value.trim().toLowerCase(); if (!validEmail(e)) return formError("Type your email above first."); await Cloud.recover(e); info("If that email has an account, a reset link is on its way."); }),
  eye: a => { const i = $("#ap"); i.type = i.type === "password" ? "text" : "password"; a.textContent = i.type === "password" ? "Show" : "Hide"; },
  cat: a => { shopCat = a.dataset.c; render(); }, wish: need(a => { const u = Auth.user(); const on = Shop.toggleWish(u.uid, a.dataset.id); a.classList.toggle("on", on); toast(on ? "Saved to wishlist" : "Removed from wishlist"); const e = $(".nav em"); if (e) e.textContent = Auth.byId(u.uid).wish.length || ""; if (/wishlist/.test(location.hash)) setTimeout(render, 450); }),
  add: a => Bag.add(a.dataset.id),
  qty: need(a => { const u = Auth.user(), c = Shop.cart(u.uid), l = c.find(x => x.pid === a.dataset.id), d = +a.dataset.d; if (d > 0) Shop.addToCart(u.uid, l.pid); else { l.q--; Shop.saveCart(u.uid, c.filter(x => x.q > 0)); } bump(); render(); }),
  place: need(async () => { const o = await Shop.place(Auth.user().uid); toast("Order " + o.id + " placed"); bump(); location.hash = "#/orders"; }),
  saveName: need(() => { const n = $("#pn").value.trim().slice(0, 60); if (!n) throw new AppError("n", "Please enter your name."); const u = Auth.user(); u.name = n; Auth.put(u); toast("Saved"); shell(); }),
  changePw: need(async () => { const e = $("#perr"); e.textContent = ""; try { await Auth.changePassword(Auth.user().uid, $("#op").value, $("#np").value); toast("Password updated"); render(); } catch (x) { e.textContent = x.message; } }),
  outAll: need(async () => { await Auth.signOutEverywhere(Auth.user().uid); toast("Signed out of all other devices"); }),
  ban: need(async a => { await Admin.ban(a.dataset.id, +a.dataset.v); toast(+a.dataset.v ? "Account suspended" : "Account restored"); render(); }), kick: need(async a => { await Admin.kick(a.dataset.id); toast("Signed out"); }),
  status: need(async a => { await Admin.setStatus(a.dataset.id, a.value); toast("Order updated"); }),
  editProd: a => prodForm(Shop.products().find(p => p.id === a.dataset.id)),
  saveProd: need(async a => { Admin.guard(); const g = i => $(i).value.trim(), name = g("#fn"), price = +g("#fp"), stock = +g("#fk"), img = g("#fi");
    if (!name || !(price >= 0) || !(stock >= 0) || g("#fp") === "" || g("#fk") === "") return $("#ferr").textContent = "Add a name, price and stock.";
    if (img && !safeUrl(img)) return $("#ferr").textContent = "Image link must start with https://";
    const l = Shop.products().slice(), id = a.dataset.id, rec = { ...(l.find(p => p.id === id) || {}), id: id || "p" + now().toString(36), name, price, stock: Math.floor(stock), cat: g("#fc"), desc: g("#fd"), img, origin: g("#fo") || "India", headline: g("#fh"), tagline: g("#ft") };
    id ? l[l.findIndex(p => p.id === id)] = rec : l.push(rec); await Shop.saveProducts(l); audit("product", "owner", name + " saved"); closeModal(); toast("Product saved"); render(); }),
  delProd: need(async a => { Admin.guard(); if (!confirm("Delete this product?")) return; await Shop.saveProducts(Shop.products().filter(p => p.id !== a.dataset.id)); toast("Product deleted"); render(); }),
  carrier: need(async a => { Admin.guard(); const c = Settings.get().carriers; c[a.dataset.c] = !c[a.dataset.c]; await Settings.set({ carriers: c }); a.classList.toggle("on", c[a.dataset.c]); a.setAttribute("aria-checked", !!c[a.dataset.c]); }),
  saveShip: need(async () => { Admin.guard(); await Settings.set({ freeShip: Math.max(0, +$("#fs").value || 0), shipFee: Math.max(0, +$("#sf").value || 0) }); toast("Saved"); }),
  toggleOpen: a => { a.classList.toggle("on"); a.setAttribute("aria-checked", a.classList.contains("on")); },
  saveSettings: need(async () => { Admin.guard(); await Settings.set({ name: $("#sn").value.trim().slice(0, 40) || CONFIG.STORE_NAME, days: $("#sd") ? +$("#sd").value : 30, open: $("#so").classList.contains("on") }); toast("Saved"); shell(); }),
  copy: need(async () => { Admin.guard(); try { await navigator.clipboard.writeText("SEED_PRODUCTS: " + JSON.stringify(Shop.products(), null, 2)); toast("Copied. Paste it into CONFIG."); } catch { toast("Copy was blocked. Use Download instead.", true); } }),
  dl: need(a => { Admin.guard(); const w = a.dataset.w; download("mizuki-" + w + ".json", w === "products" ? Shop.products() : w === "people" ? Admin.users() : Shop.orders()); }),
  reset: need(() => { Admin.guard(); if (CLOUD) throw new AppError("cloud", "This is not available when connected online."); if (!confirm("Erase ALL local accounts, orders and settings?") ) return; Object.keys(localStorage).filter(k => k.startsWith("mz.")).forEach(k => localStorage.removeItem(k)); logout("Local data erased."); })
};
Object.assign(ACT, homeActs(need));
document.addEventListener("click", e => { const a = e.target.closest("[data-act]"); if (a && ACT[a.dataset.act] && a.tagName !== "SELECT") ACT[a.dataset.act](a, e); });
document.addEventListener("change", e => { const a = e.target.closest("select[data-act]"); if (a) ACT[a.dataset.act](a, e); });
document.addEventListener("input", e => {
  if (e.target.id === "q") { shopQ = e.target.value; const g = $("#shopgrid"); mount(g, shopGrid(Auth.user())); afterMount(g); }
  if (e.target.id === "uq") { const t = e.target.value.toLowerCase(); $$("#ut tr").forEach(r => { r.style.display = !t || (r.dataset.s || "").includes(t) ? "" : "none"; }); }
});

/* ---------- owner password setup page (#owner-setup) ---------- */
function ownerSetup() {
  closeModal(); $("#ceremony").className = "";
  if (CLOUD) return mount($("#root"), T`<section class="gate"><div class="wrap center"><span class="pill glass">Online mode</span><h1 style="font-size:2.4rem">Owner password</h1><p class="lead">In online mode your owner password lives in Supabase (Authentication, Users). Nothing to set up here.</p></div></section>`);
  mount($("#root"), T`<section class="gate"><div class="wrap" style="max-width:640px"><div class="sheet wide glass" style="margin:auto"><h2>Owner password setup</h2><p class="muted">Type the password you want to use as owner. This page scrambles it on your device and shows one line. Paste that line into <b>CONFIG → OWNER_HASH</b>, then redeploy. Your password is not sent anywhere.</p>
    <label for="op1">Owner password (12+ characters)</label><input id="op1" type="password" autocomplete="new-password"><button class="btn" id="mk" style="margin-top:1rem">Create line</button><div class="err" id="oerr"></div><pre id="oout" style="display:none"></pre>
    <p class="fine" style="margin-top:1rem"><a href="#" onclick="location.hash='';location.reload();return false">Back to the site</a></p></div></div></section>`);
  $("#mk").onclick = async () => { const p = $("#op1").value; if (p.length < 12) return $("#oerr").textContent = "Use at least 12 characters."; $("#oerr").textContent = ""; $("#mk").disabled = true; const h = await hashPw(p); $("#oout").style.display = "block"; $("#oout").textContent = "OWNER_HASH: " + JSON.stringify(h) + ","; $("#mk").disabled = false; };
}

function recoveryModal() {
  gate(); const v = modal(T`<h2>Choose a new password</h2><p class="muted">Use at least 8 characters.</p><label for="rp">New password</label><input id="rp" type="password" autocomplete="new-password" maxlength="128"><div class="err" id="rerr"></div><button class="btn block" id="rgo">Save password</button>`);
  $("#rgo").onclick = async () => {
    const p = $("#rp").value; if (p.length < 8) return $("#rerr").textContent = "Use at least 8 characters.";
    try { await Cloud.api("/auth/v1/user", { method: "PUT", body: { password: p } }); await Cloud.establish({ ...Cloud.tok }); await Cloud.recordLogin(); closeModal(); await enter(Auth.session(), true); }
    catch (e) { $("#rerr").textContent = e.message; }
  };
}

/* ---------- start ---------- */
(async function boot() {
  Mizuki.init();
  if (location.hash === "#owner-setup") return ownerSetup();
  if (location.hash === "#/debug") return debugPage();
  if (CLOUD) {
    mount($("#root"), T`<section class="gate"><div class="wrap center"><span class="pill glass load">${CONFIG.STORE_NAME}</span></div></section>`);
    try { await Cloud.init(); } catch (e) { Cloud.notice = e.message; }
    if (Cloud.recovery) return recoveryModal();
    const s = Auth.session(); if (s) return enter(s, Cloud.fresh);
    gate(); if (Cloud.notice) toast(Cloud.notice, true); return;
  }
  const had = ls.get("session", null), s = Auth.session();
  if (s) return enter(s, false);
  gate(); if (had) { const u = had.uid && Auth.byId(had.uid); toast(u && u.banned ? "This account has been suspended." : "Your session ended. Please log in again.", true); Auth.end(); }
})();
</script>
